name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # `shared/` is a source package that neither of the other jobs compiles.
  # Locally it reaches the extension and CLI through a *junction*
  # (node_modules/codelapse-core -> shared/), but that junction is created by
  # hand, not by npm -- there are no `workspaces` declarations. So `npm ci` here
  # and in the jobs below installs the *published* codelapse-core from the
  # registry, not the local source. Two consequences worth knowing:
  #   1. A change to shared/src does not affect what CI tests. Anything fixed
  #      here must be published (or the repo moved to npm workspaces) before the
  #      other jobs exercise it.
  #   2. Without this job, shared/ was compiled by nothing at all, so a compile
  #      error in it passed CI while breaking every local build.
  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # No lint or format:check step here, deliberately. shared/ has neither
      # script, and 8 of its files do not currently satisfy prettier. Add both
      # once those are formatted, rather than gating on a check that would fail
      # on arrival.

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        # `set -o pipefail` is load-bearing. The default shell for `run:` is
        # `bash -e {0}`, which has no pipefail, so this pipeline's status was
        # `tee`'s -- always 0 -- and eslint errors could not fail this job.
        # With pipefail, errors fail the step. Warnings do not: the remaining
        # warnings are real but pre-existing, so they are reported rather than
        # gated. The summary line below prints the count each run, so drift is
        # visible without a hard-coded number here that goes stale.
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.txt
          echo "### Extension lint warnings: $(grep -c ' warning ' /tmp/lint.txt || true)" >> "$GITHUB_STEP_SUMMARY"
      # Must be `format:check`, not `format -- --check`. The `format` script is
      # `prettier --write`, and passing `--check` alongside `--write` makes
      # prettier REWRITE the files and exit 0 -- so the previous invocation
      # could never fail and silently masked violations instead of reporting
      # them. Verified with a deliberately malformed file.
      - name: Format check
        run: npm run format:check
      - name: Compile
        run: npm run compile
      - name: Test
        # --runInBand: the forked-worker pool fails with EPERM in restricted
        # environments. --forceExit: the suite reports leaked handles and does
        # not exit on its own (CliConnectorService never closes its server).
        run: npx jest --runInBand --ci --forceExit
      - name: Package
        # Proves the extension still bundles AND that `vsce` accepts the
        # manifest: a malformed `contributes` block, a command with no
        # registration or a missing icon fails here rather than at publish
        # time. This runs `vscode:prepublish`, so it re-runs the type-check and
        # the production esbuild on top of the Compile step above.
        run: npx vsce package --no-dependencies --out /tmp/codelapse.vsix

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      # The Lint and Format check steps below run cli/package.json's scripts,
      # but cli/ declares neither eslint nor prettier: they live in the root
      # package. Locally `npm run lint` finds them only because npm puts every
      # ancestor node_modules/.bin on PATH -- in CI that ancestor has to exist,
      # so install the root toolchain here as well as cli's dependencies.
      # Without this, both steps fail with "eslint: not found" / "prettier: not
      # found" (exit 127) instead of reporting findings, and a `not found` exit
      # is precisely what the `| tee` in the Lint step used to swallow.
      - name: Install root toolchain
        run: npm ci
        # A step-level `working-directory` replaces this job's
        # `defaults.run.working-directory: cli`, but an absolute path says so
        # unambiguously: `${{ github.workspace }}` resolves against the
        # checkout, so this installs the repository root's tools, not cli's.
        working-directory: ${{ github.workspace }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        # Added alongside the formatting fix: cli/ had 43 eslint errors that no
        # gate ever caught, because this job only type-checked, tested and built.
        # `set -o pipefail` is load-bearing here for the same reason as in the
        # extension job: without it the step's status is `tee`'s, always 0, so
        # errors could not fail the job. Errors now fail the step; warnings are
        # only counted, in the summary line below.
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint-cli.txt
          echo "### CLI lint warnings: $(grep -c ' warning ' /tmp/lint-cli.txt || true)" >> "$GITHUB_STEP_SUMMARY"
      - name: Format check
        run: npm run format:check
      - name: Type-check sources
        run: npm run check-types
      - name: Type-check tests
        # cli/tsconfig.json excludes **/*.test.ts so tests are not emitted to
        # dist/. That exclusion is why four suites could fail to compile while
        # `tsc --noEmit` still exited 0. This step checks them.
        run: npm run check-types:test
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build
