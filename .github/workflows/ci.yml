name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # `shared/` is a source package that neither of the other jobs compiles.
  # Locally it reaches the extension and CLI through a *junction*
  # (node_modules/codelapse-core -> shared/), but that junction is created by
  # hand, not by npm -- there are no `workspaces` declarations. So `npm ci` here
  # and in the jobs below installs the *published* codelapse-core from the
  # registry, not the local source. Two consequences worth knowing:
  #   1. A change to shared/src does not affect what CI tests. Anything fixed
  #      here must be published (or the repo moved to npm workspaces) before the
  #      other jobs exercise it.
  #   2. Without this job, shared/ was compiled by nothing at all, so a compile
  #      error in it passed CI while breaking every local build.
  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # No lint or format:check step here, deliberately. shared/ has neither
      # script, and 8 of its files do not currently satisfy prettier. Add both
      # once those are formatted, rather than gating on a check that would fail
      # on arrival.

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # Must be `format:check`, not `format -- --check`. The `format` script is
      # `prettier --write`, and passing `--check` alongside `--write` makes
      # prettier REWRITE the files and exit 0 -- so the previous invocation
      # could never fail and silently masked violations instead of reporting
      # them. Verified with a deliberately malformed file.
      - name: Format check
        run: npm run format:check
      - name: Compile
        run: npm run compile
      - name: Test
        # --runInBand: the forked-worker pool fails with EPERM in restricted
        # environments. --forceExit: the suite reports leaked handles and does
        # not exit on its own (CliConnectorService never closes its server).
        run: npx jest --runInBand --ci --forceExit

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        # Added alongside the formatting fix: cli/ had 43 eslint errors that no
        # gate ever caught, because this job only type-checked, tested and built.
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type-check sources
        run: npm run check-types
      - name: Type-check tests
        # cli/tsconfig.json excludes **/*.test.ts so tests are not emitted to
        # dist/. That exclusion is why four suites could fail to compile while
        # `tsc --noEmit` still exited 0. This step checks them.
        run: npm run check-types:test
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build
